<div class="login-card">
    <div class="login-card__mobile-brand">
        <div class="login-card__mark">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M13 2 4 13.5h6.2L10.5 22 20 9.8h-6.4L13 2Z" fill="currentColor" />
            </svg>
        </div>
        <span>Fluxify</span>
    </div>

    <header class="login-card__header">
        <h1>Tekrar hoş geldin</h1>
        <p>Devam etmek için hesabına giriş yap.</p>
    </header>

    @if (errorMessage()) {
    <div class="login-card__error">
        <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6" />
            <path d="M12 8v4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <circle cx="12" cy="15.5" r="0.9" fill="currentColor" />
        </svg>
        <span>{{ errorMessage() }}</span>
    </div>
    }

    <form class="login-form" (ngSubmit)="onLogin()">
        <div class="field">
            <label for="identifier">Kullanıcı adı</label>
            <div class="field__control">
                <svg viewBox="0 0 24 24" fill="none" class="field__icon">
                    <path d="M4 6.5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"
                        stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                    <path d="m4 7.5 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <input id="identifier" type="text" autocomplete="username" placeholder="Kullanıcı Adı"
                    [value]="username()" (input)="username.set($any($event.target).value)" />
            </div>
        </div>

        <div class="field">
            <label for="password">Şifre</label>
            <div class="field__control">
                <svg viewBox="0 0 24 24" fill="none" class="field__icon">
                    <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6" />
                    <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" />
                </svg>
                <input id="password" [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password"
                    placeholder="••••••••" [value]="password()" (input)="password.set($any($event.target).value)" />
                <button type="button" class="field__toggle" (click)="togglePasswordVisibility()"
                    [attr.aria-pressed]="showPassword()">
                    @if (showPassword()) {
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M3 12s3.6-6.5 9-6.5 9 6.5 9 6.5-3.6 6.5-9 6.5S3 12 3 12Z" stroke="currentColor"
                            stroke-width="1.6" stroke-linejoin="round" />
                        <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6" />
                    </svg>
                    } @else {
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M3 12s3.6-6.5 9-6.5c1.7 0 3.2.5 4.5 1.3M21 12s-1 1.9-3 3.5M3 3l18 18"
                            stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M9.9 9.9a2.6 2.6 0 0 0 3.7 3.6" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" />
                    </svg>
                    }
                </button>
            </div>
        </div>

        <div class="login-form__row">
            <!-- <button type="button" class="checkbox" [class.checkbox--checked]="rememberMe()" (click)="toggleRememberMe()">
        <span class="checkbox__box">
          @if (rememberMe()) {
            <svg viewBox="0 0 24 24" fill="none">
              <path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
        </span>
        Beni hatırla
      </button>

      <a routerLink="/auth/forgot-password" class="login-form__forgot">Şifremi unuttum</a> -->
        </div>

        <app-button type="submit" [disabled]="isLoading() || !username().trim() || !password().trim()">
            @if (isLoading()) {
            <span class="spinner"></span>
            Giriş yapılıyor...
            } @else {
            Giriş yap
            }
        </app-button>
    </form>

    <!-- <p class="login-card__footer">
    Hesabın yok mu? <a routerLink="/auth/register">Kayıt ol</a>
  </p> -->
</div>
