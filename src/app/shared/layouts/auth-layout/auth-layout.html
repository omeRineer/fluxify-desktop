<div class="window">
    <div class="title-bar">
        <div class="title-left">
            <span class="title-dot"></span>
            <span class="title-text">Fluxify</span>
        </div>
        <div class="window-controls">
            <button id="min-btn" title="Küçült" (click)="minimize()">&#8211;</button>
            <button id="close-btn" title="Kapat" (click)="close()">&times;</button>
        </div>
    </div>

    <!-- İçerik Alanı -->
    <div class="content-area">
        @if (isLoading()) {
        <app-spinner message="Oturum kontrol ediliyor"></app-spinner>
        }
        @else {
        <div class="auth-shell">
            <aside class="auth-visual">
                <div class="auth-visual__blob auth-visual__blob--a"></div>
                <div class="auth-visual__blob auth-visual__blob--b"></div>

                <div class="auth-visual__content">
                    <div class="auth-visual__brand">
                        <div class="auth-visual__mark">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M13 2 4 13.5h6.2L10.5 22 20 9.8h-6.4L13 2Z" fill="currentColor" />
                            </svg>
                        </div>
                        <span class="auth-visual__name">Fluxify</span>
                    </div>
                </div>

                <span class="auth-visual__version fx-mono">Fluxify Desktop v1.0</span>
            </aside>

            <main class="auth-content">
                <router-outlet></router-outlet>
            </main>
        </div>
        }
    </div>


</div>
